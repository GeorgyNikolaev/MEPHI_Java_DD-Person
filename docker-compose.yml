# Локальная инфраструктура: PostgreSQL + Redis
# Запуск: docker compose up -d

name: dd-person

services:

  postgres:
    image: postgres:16-alpine
    container_name: dd-person-postgres
    environment:
      POSTGRES_DB: dd_person
      POSTGRES_USER: dd_person
      POSTGRES_PASSWORD: dd_person
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dd_person -d dd_person"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dd-person-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
