# Локальная разработка (localhost)
# Секреты — через .env или переменные окружения

spring:
  application:
    name: dd-person

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  messages:
    basename: i18n/messages
    encoding: UTF-8

  datasource:
    url: jdbc:postgresql://localhost:5432/dd_person
    username: dd_person
    password: dd_person

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

app:
  cors:
    allowed-origins:
      - http://localhost:5173

  jwt:
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
    secret: ${JWT_SECRET:local-dev-secret-change-me-32chars-min}

  gigachat:
    auth-key: ${GIGACHAT_AUTH_KEY:}
    scope: GIGACHAT_API_PERS
    model: GigaChat

  storage:
    portraits-path: ./storage/portraits

  rate-limit:
    generations-per-day: 10
    generations-per-hour: 3

logging:
  level:
    ddperson: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health
